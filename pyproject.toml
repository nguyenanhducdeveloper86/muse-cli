[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-cli"
version = "0.2.0"
description = "Unofficial CLI, OpenAI Bridge & Model Context Protocol (MCP) Server for Muse.ai"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Duc Nguyen", email = "nguyenanhducdeveloper@gmail.com" }
]
keywords = ["muse", "meta-ai", "openai-bridge", "cli", "ai-agent", "mcp", "model-context-protocol", "image-generation", "video-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "playwright>=1.40.0",
    "pillow>=10.0.0",
]

[project.scripts]
muse = "muse.cli:main"
muse-cli = "muse.cli:main"
muse-bridge = "muse.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["muse*"]
